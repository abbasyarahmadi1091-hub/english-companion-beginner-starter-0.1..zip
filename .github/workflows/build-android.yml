name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q english-companion-beginner-starter-0.1.0.zip -d extracted
          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project files not found"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Prepare Android
        run: |
          flutter create . --platforms=android
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-companion-beginner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
